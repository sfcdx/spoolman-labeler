[project]
name = "spoolman-labeler"
version = "0.1.0"
description = "Filamentrollen in Spoolman erfassen und in einem Schritt über CUPS etikettieren."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.28",
    "jinja2>=3.1.5",
    "weasyprint>=63",
    "segno>=1.6",
]

# pycups wird bewusst NICHT hier gefuehrt. Es ist eine C-Erweiterung, die auf
# PyPI nur als sdist vorliegt und damit einen Compiler erzwingen wuerde. Im
# Container kommt sie aus dem Distributionspaket python3-cups (siehe ADR-008).
# Der Code importiert sie defensiv, damit Tests und lokale Entwicklung ohne
# installiertes CUPS funktionieren.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "S",    # bandit
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # assert ist in Tests erwuenscht
    # Depends() im Argument-Default ist das vorgesehene FastAPI-Muster.
    # Der Aufruf erfolgt nicht bei Importzeit, sondern je Anfrage.
    "B008",
]

[tool.ruff.lint.isort]
# Ohne diese Angabe sortiert Ruff "app" faelschlich als Fremdpaket ein.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# cups liefert keine Typinformationen mit.
module = ["cups.*", "weasyprint.*", "segno.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error"]
