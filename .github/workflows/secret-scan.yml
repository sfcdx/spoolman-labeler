name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Vollständige Historie, damit auch ältere Commits geprüft werden.
          fetch-depth: 0

      - name: Gitleaks installieren
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Repository scannen
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  forbidden-files:
    name: Verbotene Dateien
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auf versehentlich eingecheckte Daten prüfen
        run: |
          set -euo pipefail

          # Dateien, die niemals im Repository landen dürfen. `.env.example`
          # ist ausdrücklich erlaubt und darf nur Platzhalter enthalten.
          found=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.(db|sqlite3?|pem|key|p12|pfx)$' \
            | grep -v '^\.env\.example$' \
            || true)

          if [ -n "$found" ]; then
            echo "::error::Unerlaubte Dateien im Repository gefunden:"
            echo "$found"
            exit 1
          fi

          echo "Keine unerlaubten Dateien gefunden."
