#
# cupsd.conf fuer den Spoolman-Labeler-Sidecar
#
# Diese Datei wird zur Build-Zeit nach /etc/cups/cupsd.conf gelegt UND nach
# /etc/cups-bak gesichert. Der Entrypoint stellt sie nur wieder her, wenn sie
# im Volume fehlt (cp -rpn). Eigene Aenderungen des Betreibers ueberleben damit
# jedes Image-Update.
#
# Begruendung der einzelnen Direktiven:
# docs/printing-architecture.md, Abschnitt 4.5.
#

# --- Logging ---------------------------------------------------------------
# Auf stderr, damit `docker compose logs cups` funktioniert und nichts
# unbemerkt im Container-Dateisystem volllaeuft.
ErrorLog stderr
AccessLog stderr
PageLog stderr
LogLevel warn
MaxLogSize 0

# --- Netzwerk --------------------------------------------------------------
# Auf allen Container-Interfaces lauschen. Die Isolation macht Docker ueber
# das Port-Mapping (Default 127.0.0.1:631), nicht cupsd.
Listen 0.0.0.0:631

# Unix-Socket: die Web-UI-CGIs oeffnen darueber einen privilegierten
# Back-Channel zu cupsd. Ohne diesen Listener schlagen Admin-Aktionen in der
# Web-UI mit "Unauthorized" fehl, obwohl die Zugangsdaten stimmen.
Listen /run/cups/cups.sock

# Der Container wird unter wechselnden Namen angesprochen: Compose-Service-Name
# "cups", Container-IP, 127.0.0.1 vom Host aus. Ohne ServerAlias lehnt cupsd
# Requests mit "Bad Request" wegen Host-Header-Mismatch ab.
ServerAlias *

# Kein mDNS/DNS-SD: Avahi ist bewusst nicht im Image (ADR-007). Wir wollen
# unsere Queues auch nicht bewerben - der einzige Client ist die App.
Browsing Off
BrowseLocalProtocols none
DefaultShared No

# --- Web-Oberflaeche und Authentifizierung ---------------------------------
WebInterface Yes
DefaultAuthType Basic
# Kein TLS im Container: der Zugang laeuft ueber 127.0.0.1 bzw. einen
# SSH-Tunnel. "Required" wuerde ein Zertifikat erzwingen, das niemand prueft.
DefaultEncryption IfRequested

# --- Job-Verhalten ---------------------------------------------------------
# Wiederholversuche statt sofortigem Abbruch, wenn der Drucker kurz weg ist
# (leere Rolle, Deckel offen). Das Statusmapping der App setzt darauf auf:
# processing-stopped wird als "laeuft, aber blockiert" gezeigt, nicht als
# Fehler. Siehe docs/printing-architecture.md, Abschnitt 7.3.
ErrorPolicy retry-job

# Job-Metadaten aufheben, damit die App den Status nachtraeglich abfragen kann.
# PreserveJobFiles No ist wichtig: sonst fuellen sich mit jedem Etikett die
# Spool-Daten - und /var/spool/cups wird bewusst NICHT persistiert (ADR-006).
PreserveJobHistory Yes
PreserveJobFiles No
MaxJobs 500

# Etiketten sind Sekundenvorgaenge; ein haengender Job soll nicht ewig blocken.
Timeout 300
KeepAlive Yes

# --- Zugriffskontrolle -----------------------------------------------------
# @LOCAL erlaubt Adressen aus direkt angeschlossenen Subnetzen. Im Bridge-Netz
# von Docker ist das genau das Compose-Netzwerk plus der Host - strenger als
# das "Allow all" der gaengigen Fremd-Images.
#
# Die eigentliche Absicherung administrativer Operationen passiert unabhaengig
# davon auf Policy-Ebene weiter unten (Require user @SYSTEM).

<Location />
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin>
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>

# --- Policies --------------------------------------------------------------
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Lesende Operationen: keine Authentifizierung noetig.
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs \
         Set-Job-Attributes Create-Job-Subscription Renew-Subscription \
         Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job \
         Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Alles, was die Druckerkonfiguration aendert: nur fuer @SYSTEM (lpadmin).
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class \
         CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer \
         Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs \
         Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer \
         Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs \
         CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
